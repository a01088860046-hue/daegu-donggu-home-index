name: Update real transaction data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'dist/data/transactions.json'
  schedule:
    # Every day at 06:20 KST (21:20 UTC)
    - cron: '20 21 * * *'

permissions:
  contents: write

concurrency:
  group: real-transaction-data
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch MOLIT apartment transactions
        env:
          DATA_GO_KR_API_KEY: ${{ secrets.DATA_GO_KR_API_KEY }}
        shell: bash
        run: |
          if [ -z "$DATA_GO_KR_API_KEY" ]; then
            echo "::error title=Secret missing::Repository secret DATA_GO_KR_API_KEY is not registered."
            exit 1
          fi
          if ! output=$(node scripts/fetch-transactions.mjs 2>&1); then
            safe_output=$(printf '%s' "$output" | grep -m1 -E 'Error:|SERVICE_|PERMISSION_|HTTP [0-9]+' | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            [ -n "$safe_output" ] || safe_output="API request failed without a readable response."
            echo "::error title=MOLIT API sync failed::$safe_output"
            exit 1
          fi
          echo "$output"
      - name: Commit refreshed public data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/data/transactions.json
          git diff --cached --quiet || git commit -m "Update MOLIT transaction data"
          git push
      - name: Publish GitHub Pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
